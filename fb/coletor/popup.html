<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>FB Radar Coletor</title>
  <style>
    :root { --bg: #ffffff; --text: #1c1917; --muted: #6b7280; --border: #e5e7eb; --primary: #ea580c; --danger: #dc2626; --ok: #16a34a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --border: #3f3f46; --primary: #fb923c; --danger: #f87171; --ok: #4ade80; }
    }
    body { margin: 0; width: 300px; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 16px; }
    .estado { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
    .ligado .ponto { background: var(--ok); }
    p { margin: 0; color: var(--muted); font-size: 13px; }
    p.erro { color: var(--danger); }
    button, select { font: inherit; cursor: pointer; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); }
    #btnAlternar { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    #btnAlternar.parar { background: var(--danger); border-color: var(--danger); }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
    select { padding: 6px 8px; }
    .linha { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 4px; }
    a { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <h1>🎮 FB Radar Coletor</h1>
    <div id="estado" class="estado"><span class="ponto"></span><span id="estadoTexto">…</span></div>
    <button id="btnAlternar" type="button">…</button>
    <button id="btnAgora" type="button">🔄 Conferir agora</button>
    <label>Conferir a cada
      <select id="intervalo">
        <option value="2">2 min</option>
        <option value="3">3 min</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
      </select>
    </label>
    <div class="linha">
      <p id="ultima"></p>
      <p id="proxima"></p>
      <p><a href="http://localhost:5500/fb/" target="_blank">Abrir o FB Radar</a></p>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
